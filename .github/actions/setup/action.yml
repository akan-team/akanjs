name: Setup
description: Install Bun at the version package.json pins and the workspace dependencies from bun.lock.
runs:
  using: composite
  steps:
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version: 1.4.4
    - id: bun-version
      shell: bash
      run: echo "version=$(bun --version)" >> "$GITHUB_OUTPUT"
    # Restored and saved by hand rather than with actions/cache, whose post-job save would capture whatever the job's builds and tests wrote under node_modules.
    - id: node-modules
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: |
          node_modules
          pkgs/*/node_modules
          pkgs/@akanjs/*/node_modules
        key: node-modules-${{ runner.os }}-${{ runner.arch }}-bun-${{ steps.bun-version.outputs.version }}-${{ hashFiles('bun.lock', 'bunfig.toml', 'package.json', 'pkgs/*/package.json', 'pkgs/@akanjs/*/package.json') }}
    - if: steps.node-modules.outputs.cache-hit != 'true'
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ~/.bun/install/cache
        key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
        restore-keys: bun-${{ runner.os }}-
    # Also on a hit: next to nothing on a sound tree, and it repairs a restored one that is not.
    - shell: bash
      run: bun install --frozen-lockfile
    - if: steps.node-modules.outputs.cache-hit != 'true'
      uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: |
          node_modules
          pkgs/*/node_modules
          pkgs/@akanjs/*/node_modules
        key: ${{ steps.node-modules.outputs.cache-primary-key }}
