name: Publish editor extension

on:
  push:
    branches: [rc]
    paths:
      - pkgs/@akanjs/vscode/**
      - pkgs/@akanjs/language/**
      - pkgs/akanjs/common/akanNames.ts
      - pkgs/akanjs/common/akanGraph.ts
      - pkgs/akanjs/common/capitalize.ts
      - bun.lock
      - apps/akan/public/icon-512x512.png
      - .github/workflows/vscode-publish.yml
  workflow_dispatch:
    inputs:
      sha:
        description: A commit on the dispatched branch to publish, instead of its head
        required: false
        default: ""

concurrency:
  group: vscode-publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build the vsix
    if: github.ref_name == 'main' || github.ref_name == 'rc'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - name: Check the commit is on the branch
        if: inputs.sha
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ inputs.sha }}
        run: |
          if ! [[ "$SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::sha takes a full 40-character commit hash; got \"$SHA\"."
            exit 1
          fi
          status=$(gh api "repos/$GITHUB_REPOSITORY/compare/$SHA...$GITHUB_REF_NAME" --jq .status)
          if [ "$status" != identical ] && [ "$status" != ahead ]; then
            echo "::error::$SHA is not on $GITHUB_REF_NAME ($status), and only $GITHUB_REF_NAME may publish."
            exit 1
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.sha || github.sha }}
      - uses: ./.github/actions/setup
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: DIST_DIR="$RUNNER_TEMP/akan-vscode" bun pkgs/@akanjs/vscode/build.ts --vsix --${{ github.ref_name == 'rc' && 'pre-release' || 'release' }}=${{ github.run_number }}
      - name: Check the version against the registries
        id: check
        run: |
          version=$(jq -r .version "$RUNNER_TEMP/akan-vscode/package.json")
          versions=$(curl -fsS -X POST https://marketplace.visualstudio.com/_apis/public/gallery/extensionquery \
            -H 'Content-Type: application/json' -H 'Accept: application/json;api-version=7.2-preview.1' \
            -d '{"filters":[{"criteria":[{"filterType":7,"value":"akanjs.akan"}]}],"flags":1}' \
            | jq -c '[.results[0].extensions[0].versions[]?.version]')
          if [ "$GITHUB_REF_NAME" = rc ]; then
            higher=$(jq -r --arg v "$version" '($v | split(".") | map(tonumber)) as $mine
              | map(select((split(".") | map(tonumber)) > $mine)) | max_by(split(".") | map(tonumber)) // empty' <<< "$versions")
            if [ -n "$higher" ]; then
              echo "::error::Pre-release $version is below the published $higher, so no one would get it. Merge main into rc."
              exit 1
            fi
          fi
          openvsx=$(curl -s -o /dev/null -w '%{http_code}' "https://open-vsx.org/api/akanjs/akan/$version")
          if [ "$openvsx" != 200 ] && [ "$openvsx" != 404 ]; then
            echo "::error::Open VSX answered $openvsx for akanjs.akan $version."
            exit 1
          fi
          if [ "$openvsx" = 200 ] && jq -e --arg v "$version" 'any(.[]; . == $v)' <<< "$versions" > /dev/null; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::akanjs.akan $version is already on the VS Marketplace and Open VSX."
            exit 0
          fi
          openvsx_versions=$(curl -fsS --retry 3 https://open-vsx.org/api/akanjs/akan \
            | jq -c '[.allVersions | keys[] | select(test("^[0-9]+\\.[0-9]+\\.[0-9]+$"))]') || {
            echo "::warning::Could not list the Open VSX versions, so $version is published without comparing it to the last one."
            exit 0
          }
          previous=$(jq -rn --arg v "$version" --argjson mp "$versions" --argjson ovsx "$openvsx_versions" '
            ($v | split(".") | map(tonumber)) as $mine
            | $mp + $ovsx | map(split(".") | map(tonumber) | select(. < $mine and .[1] % 2 == $mine[1] % 2))
            | max // empty | map(tostring) | join(".")')
          [ -n "$previous" ] || exit 0
          for list in "$versions" "$openvsx_versions"; do
            if ! jq -e --arg p "$previous" 'any(.[]; . == $p)' <<< "$list" > /dev/null; then
              echo "::notice::$previous is not on both registries, so $version is published to bring them level."
              exit 0
            fi
          done
          curl -fsSL --compressed --retry 3 -o "$RUNNER_TEMP/previous.vsix" \
            "https://marketplace.visualstudio.com/_apis/public/gallery/publishers/akanjs/vsextensions/akan/$previous/vspackage" || {
            echo "::warning::Could not download $previous, so $version is published without comparing it to the last one."
            exit 0
          }
          unzip -q "$RUNNER_TEMP/previous.vsix" 'extension/*' -d "$RUNNER_TEMP/previous"
          unzip -q "$RUNNER_TEMP/akan-$version.vsix" 'extension/*' -d "$RUNNER_TEMP/current"
          for side in previous current; do
            manifest="$RUNNER_TEMP/$side/extension/package.json"
            jq 'del(.version)' "$manifest" > "$manifest.tmp" && mv "$manifest.tmp" "$manifest"
          done
          if diff -rq "$RUNNER_TEMP/previous/extension" "$RUNNER_TEMP/current/extension"; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::The extension built here matches the published $previous, so $version is not published."
          fi
      - name: Test the packages the extension bundles
        if: steps.check.outputs.skip != 'true'
        run: |
          bun run buildAkan
          for p in @akanjs/language @akanjs/vscode; do bun run runAkan test "$p"; done
          bun run runAkan test akanjs common/akanNames.test.ts
      - if: steps.check.outputs.skip != 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: vsix
          path: ${{ runner.temp }}/akan-*.vsix
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish
    needs: build
    if: needs.build.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: vscode-publish
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: vsix
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: VS Marketplace
        run: npx --yes @vscode/vsce@4.1.0 publish --oidc --skip-duplicate --packagePath akan-*.vsix ${{ github.ref_name == 'rc' && '--pre-release' || '' }}
      - name: Open VSX
        run: npx --yes ovsx@1.4.0 publish --trusted-publishing --skip-duplicate --packagePath akan-*.vsix
