name: Publish rc packages to npm

on:
  push:
    branches: [rc]
  workflow_dispatch:

concurrency:
  group: npm-publish
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  ci:
    name: CI
    if: github.ref_name == 'rc'
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish the next rc
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    outputs:
      version: ${{ steps.publish.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      # npm trusted publishing needs npm 11.5.1 or later.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Version the packages as the pending changesets will release them
        id: release
        run: |
          current=$(jq -r .version pkgs/akanjs/package.json)
          bun run changeset:version
          release=$(jq -r .version pkgs/akanjs/package.json)
          if [ "$release" = "$current" ]; then
            echo "::notice::No pending changeset moves akanjs past $current, so there is no rc to publish."
          else
            echo "release=$release" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish the next rc of that release
        id: publish
        if: steps.release.outputs.release
        run: |
          bun run akan deploy-akan --registry npm --test false --prerelease rc --yes
          echo "version=$(jq -r .version pkgs/akanjs/package.json)" >> "$GITHUB_OUTPUT"

  tag:
    name: Tag the published commit
    needs: publish
    if: needs.publish.outputs.version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - run: gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/v$VERSION" -f sha="$GITHUB_SHA"
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.publish.outputs.version }}
