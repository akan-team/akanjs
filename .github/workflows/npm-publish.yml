name: Publish rc packages to npm

on:
  push:
    branches: [rc]
  workflow_dispatch:

concurrency:
  group: npm-publish
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  ci:
    name: CI
    if: github.ref_name == 'rc'
    uses: ./.github/workflows/ci.yml

  pack:
    name: Pack the next rc
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.pack.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - name: Version the packages as the pending changesets will release them
        id: release
        run: |
          current=$(jq -r .version pkgs/akanjs/package.json)
          bun run changeset:version
          release=$(jq -r .version pkgs/akanjs/package.json)
          if [ "$release" = "$current" ]; then
            echo "::notice::No pending changeset moves akanjs past $current, so there is no rc to publish."
          else
            echo "release=$release" >> "$GITHUB_OUTPUT"
          fi
      - name: Pack the next rc of that release
        id: pack
        if: steps.release.outputs.release
        run: |
          bun run akan deploy-akan --registry npm --test false --prerelease rc --pack-to "$RUNNER_TEMP/npm-packs"
          echo "version=$(jq -r .version "$RUNNER_TEMP/npm-packs/publish.json")" >> "$GITHUB_OUTPUT"
      - if: steps.pack.outputs.version
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-packs
          path: ${{ runner.temp }}/npm-packs
          if-no-files-found: error
          retention-days: 30

  # The job that can mint an npm token installs and builds nothing, so no dependency's code runs beside it.
  publish:
    name: Publish the next rc
    needs: pack
    if: needs.pack.outputs.version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm-publish
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-packs
      # npm trusted publishing needs npm 11.5.1 or later.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Publish the tarballs, each after the packages it depends on
        run: |
          tag=$(jq -r .tag publish.json)
          for tarball in $(jq -r '.tarballs[]' publish.json); do
            npm publish "$tarball" --tag "$tag" --provenance
          done

  # npm has served a release's packages up to an hour apart, and an install that pins them all fails until the last
  # one is there. The tag below is the sign that every package of the version installs.
  served:
    name: Wait until the registry serves every package
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-packs
      - name: Poll the version and the tarball of each package
        # The package document is what an install resolves a version and a dist-tag from, and it can trail the
        # version's own document by minutes.
        run: |
          version=$(jq -r .version publish.json)
          tag=$(jq -r .tag publish.json)
          for tarball in $(jq -r '.tarballs[]' publish.json); do
            name=$(tar -xzOf "$tarball" package/package.json | jq -r .name)
            until url=$(curl -fsS --max-time 30 "https://registry.npmjs.org/$name/$version" | jq -er .dist.tarball) &&
              curl -fsSI --max-time 30 -o /dev/null "$url" &&
              curl -fsS --max-time 30 -H 'Accept: application/vnd.npm.install-v1+json' "https://registry.npmjs.org/$name" |
              jq -e --arg version "$version" --arg tag "$tag" '.versions[$version] and ."dist-tags"[$tag] == $version' >/dev/null; do
              echo "$name@$version is not served yet"
              sleep 60
            done
            echo "$name@$version is served"
          done

  tag:
    name: Tag the published commit
    needs: [pack, publish, served]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - run: gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/v$VERSION" -f sha="$GITHUB_SHA"
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.pack.outputs.version }}
