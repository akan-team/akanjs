name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: ./node_modules/.bin/biome ci --diagnostic-level=error --reporter=github .

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: bun run typecheckPkgs

  typecheck-libs:
    name: Typecheck libs
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: bun run buildAkan
      - name: Seed each lib's gitignored test env from its tracked example
        run: for lib in util shared; do cp "libs/$lib/env/env.server.example.ts" "libs/$lib/env/env.server.testing.ts"; done
      - run: bun run runAkan typecheck util
      - run: bun run runAkan typecheck shared

  test:
    name: Test (${{ matrix.package }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        package: [akanjs, "@akanjs/devkit", "@akanjs/cli", "@akanjs/native", create-akan-workspace, use-agentic]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: bun run buildAkan
      - run: bun run runAkan test "$PACKAGE"
        env:
          PACKAGE: ${{ matrix.package }}

  sync:
    name: Sync is clean
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: bun run buildAkan
      - run: bun run runAkan sync-all
      - name: Fail when sync changed tracked files
        run: |
          if [ -n "$(git status --porcelain --untracked-files=all)" ]; then
            git status --short
            git --no-pager diff
            echo "::error::akan sync changed tracked files. Run it locally and commit the result."
            exit 1
          fi
