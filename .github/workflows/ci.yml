name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup
      - run: ./node_modules/.bin/biome ci --diagnostic-level=error --reporter=github .

  akan-lint:
    name: Akan lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Full history: the maintainability gate compares each akan.baseline.json with its copy on main.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - run: bun run buildAkan
      - name: Generated agent files match their sources
        run: bun run runAkan agent install --check
      - run: bun run runAkan lint-all --no-fix

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup
      - run: bun run typecheckPkgs

  api-report:
    name: API report
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Full history: a removed or changed export is checked against the report where the branch left the base.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - run: bun run api:report --check
      - if: github.event_name == 'pull_request'
        run: bun run api:report --base "origin/$BASE_REF"
        env:
          BASE_REF: ${{ github.base_ref }}

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup
      - run: bun test --isolate ./infra/test/audit
      - run: bun run audit:deps

  typecheck-libs:
    name: Typecheck libs
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup
      - run: bun run buildAkan
      - name: Seed each lib's gitignored test env from its tracked example
        run: for lib in util shared; do cp "libs/$lib/env/env.server.example.ts" "libs/$lib/env/env.server.testing.ts"; done
      - run: bun run runAkan typecheck util
      - run: bun run runAkan typecheck shared

  packages:
    name: Packed packages
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup
      - run: bun run release:build-packages
      - run: bun run release:verify-packages
      - run: bun run release:typecheck-consumer
      - name: Build the editor extension
        run: DIST_DIR="$RUNNER_TEMP/akan-vscode" bun pkgs/@akanjs/vscode/build.ts

  test:
    name: Test (${{ matrix.package }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        package: [akanjs, "@akanjs/devkit", "@akanjs/cli", "@akanjs/native", "@akanjs/language", "@akanjs/vscode", create-akan-workspace, use-agentic]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup
      - run: bun run buildAkan
      - run: bun run runAkan test "$PACKAGE" --coverage --junit local/junit/report.xml
        env:
          PACKAGE: ${{ matrix.package }}
      - name: Name the coverage artifact
        id: coverage
        if: ${{ !cancelled() }}
        run: |
          name="${PACKAGE#@}"
          echo "name=coverage-${name//\//-}" >> "$GITHUB_OUTPUT"
          echo "junit=junit-${name//\//-}" >> "$GITHUB_OUTPUT"
        env:
          PACKAGE: ${{ matrix.package }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ !cancelled() }}
        with:
          name: ${{ steps.coverage.outputs.name }}
          path: local/coverage/
          if-no-files-found: warn
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ !cancelled() }}
        with:
          name: ${{ steps.coverage.outputs.junit }}
          path: local/junit/
          if-no-files-found: warn

  route-js-budget:
    name: Route JS budget
    # A called workflow sees its caller's `github` context, so this skips the run npm-publish.yml calls: an app's budget never holds a release.
    if: ${{ contains(github.workflow_ref, '/.github/workflows/ci.yml@') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup
      - run: bun run buildAkan
      # --fast skips the typecheck, which fails on the empty env files a fresh checkout seeds; the budget reads only bundles.
      - run: bun run runAkan build minimal --fast --check-budget
      - run: bun run runAkan build akan --fast --check-budget

  sync:
    name: Sync is clean
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup
      - run: bun run buildAkan
      - run: bun run runAkan sync-all
      - name: Fail when sync changed tracked files
        run: |
          if [ -n "$(git status --porcelain --untracked-files=all)" ]; then
            git status --short
            git --no-pager diff
            echo "::error::akan sync changed tracked files. Run it locally and commit the result."
            exit 1
          fi
      - name: Keep native core off a page drawing the synced shared lib
        working-directory: pkgs/@akanjs/devkit
        run: bun test --isolate ./frontendBuild/nativeCore.test.ts
        env:
          REQUIRE_SYNCED_LIBS: "1"

  conformance:
    name: Conformance (Postgres ${{ matrix.postgres }}, Redis ${{ matrix.redis }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - postgres: "15"
            redis: "7.2"
          - postgres: "18"
            redis: "8"
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_USER: akan
          POSTGRES_PASSWORD: akan
          POSTGRES_DB: akan
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U akan -d akan"
          --health-interval 1s
          --health-timeout 3s
          --health-retries 60
      redis:
        image: redis:${{ matrix.redis }}
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 1s
          --health-timeout 3s
          --health-retries 30
    env:
      AKAN_TEST_POSTGRES_URL: postgres://akan:akan@localhost:5432/akan
      AKAN_TEST_REDIS_URL: redis://localhost:6379
      AKAN_TEST_REQUIRE_BACKENDS: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup
      # A service container cannot mount infra/test/postgres-init.sql, so the same file is piped into the container.
      - name: Create the Postgres extensions the search engine needs
        run: docker exec -i ${{ job.services.postgres.id }} psql -U akan -d akan -v ON_ERROR_STOP=1 < infra/test/postgres-init.sql
      # The suites and their order mirror ConformanceRun in infra/test/runConformance.ts.
      - name: Framework conformance suites
        working-directory: pkgs/akanjs
        run: bun test --isolate conformance queryEvaluatorParity insightQuery server/di/predefinedAdaptor
