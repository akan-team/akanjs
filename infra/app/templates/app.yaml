{{- $namespaceParts := split "-" .Release.Namespace }}
{{- $branch := index $namespaceParts "_1" }}
{{- $config := index .Values $branch }}
{{- $database := default dict $config.database }}
{{- $mode := default "single" $database.mode }}
{{- $cluster := eq $mode "cluster" }}
{{- $storage := default dict $config.storage }}
{{- $metrics := default dict $config.metrics }}
{{- /* `helm upgrade --reuse-values` swaps in the last release's values, which may predate these keys. */}}
{{- $podSecurityContext := .Values.podSecurityContext | default (dict "runAsNonRoot" true "runAsUser" 1000 "runAsGroup" 1000 "fsGroup" 1000 "fsGroupChangePolicy" "OnRootMismatch" "seccompProfile" (dict "type" "RuntimeDefault")) }}
{{- $securityContext := .Values.securityContext | default (dict "allowPrivilegeEscalation" false "capabilities" (dict "drop" (list "ALL"))) }}
{{- $ingress := .Values.ingress | default dict }}
{{- $volumePermissions := and (not $cluster) (dig "enabled" true (.Values.volumePermissions | default dict)) }}
{{- $uid := dig "runAsUser" 1000 $podSecurityContext | int64 }}
{{- $gid := dig "runAsGroup" 1000 $podSecurityContext | int64 }}
{{- $image := printf "%s/%s/%s:%s" .Values.image.registry .Values.repoName .Values.appName (default (printf "%s-live" $branch) .Values.image.tag) }}
{{- if eq $mode "multiple" }}
{{- fail "multiple mode opens one SQLite file from every container on one host; run it with docker compose, not this chart" }}
{{- end }}
{{- if and $cluster (not $database.secretName) }}
{{- fail "cluster mode needs database.secretName: a Secret holding POSTGRES_URL and REDIS_URI" }}
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-deployment
  namespace: {{ .Values.appName }}-{{ $branch }}
  labels:
    app: app
spec:
  # A single-mode pod owns its SQLite file on a ReadWriteOnce volume, so only a cluster runs more than one.
  replicas: {{ if $cluster }}{{ default 2 $config.app.pods }}{{ else }}1{{ end }}
  selector:
    matchLabels:
      app: app
  template:
    metadata:
      labels:
        app: app
      {{- if $metrics.scrape }}
      # Only a scrape job that relabels on these reads them, and it must send AKAN_STATUS_TOKEN as a bearer or get 401.
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /_akan/app/metrics
        prometheus.io/port: "8282"
      {{- end }}
    spec:
      # `AkanServer` gives itself 30s to drain (`AKAN_SHUTDOWN_TIMEOUT_MS`); k8s defaults to exactly that, so
      # SIGKILL would land the instant its own budget expired. Leave it room to finish.
      terminationGracePeriodSeconds: 40
      {{- with $podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if $volumePermissions }}
      # A claim an image running as root wrote stays root's where the kubelet skips fsGroup (hostPath, NFS, some CSI).
      initContainers:
        - name: volume-permissions
          image: {{ $image }}
          imagePullPolicy: Always
          command:
            - sh
            - -c
            - {{ printf "find /data \\( ! -user %d -o ! -group %d \\) -exec chown -h %d:%d {} +" $uid $gid $uid $gid | quote }}
          securityContext:
            runAsUser: 0
            runAsNonRoot: false
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
              # DAC_READ_SEARCH lets find walk the 0700 snapshot directories the server makes under /workspace/sqlite.
              add:
                - CHOWN
                - FOWNER
                - DAC_READ_SEARCH
          volumeMounts:
            - name: sqlite-data
              mountPath: /data
      {{- end }}
      containers:
        - name: app
          image: {{ $image }}
          imagePullPolicy: Always
          {{- with $securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - containerPort: 8282
          resources:
            requests:
              memory: {{ $config.app.resources.requests.memory }}
              cpu: {{ $config.app.resources.requests.cpu }}
            limits:
              memory: {{ $config.app.resources.limits.memory }}
              cpu: {{ $config.app.resources.limits.cpu }}
          {{- with $database.secretName }}
          envFrom:
            - secretRef:
                name: {{ . }}
          {{- end }}
          env:
            - name: AKAN_PUBLIC_ENV
              value: {{ $branch }}
            - name: AKAN_DATABASE_MODE
              value: {{ $mode }}
            {{- if and $cluster $storage.sharedClaim }}
            - name: AKAN_STORAGE_SHARED
              value: "true"
            {{- end }}
            # One traffic replica runs in the container's only process; more spawn a gateway that proxies them.
            - name: AKAN_REPLICA
              value: {{ $config.app.replica }}
            {{- if hasKey $config.app "solo" }}
            - name: AKAN_SOLO
              value: {{ $config.app.solo | quote }}
            {{- end }}
            {{- with $metrics.tokenSecret }}
            # The scrape's bearer, read from a Secret so no values file holds it.
            - name: AKAN_STATUS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ . }}
                  key: AKAN_STATUS_TOKEN
            {{- end }}
          # With one replica nothing supervises the server but the kubelet, so these are what restarts a wedged
          # pod. `startupProbe` carries the boot: an SSR replica loads its route artifacts before it listens.
          startupProbe:
            httpGet:
              path: /_akan/app/health
              port: 8282
            periodSeconds: 5
            failureThreshold: 24
          livenessProbe:
            httpGet:
              path: /_akan/app/health
              port: 8282
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          # An image whose akanjs predates `/_akan/app/ready` answers it 404 and never turns Ready, so it is opt-in.
          readinessProbe:
            httpGet:
              path: {{ default "/_akan/app/health" .Values.readinessPath }}
              port: 8282
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 2
          {{- if not $cluster }}
          volumeMounts:
            - name: sqlite-data
              mountPath: /workspace/sqlite
            # Local blob storage (uploads) writes under /workspace/local; without this it lived on the container's
            # own filesystem and every restart dropped it. A subPath keeps the SQLite files at the volume root where
            # existing releases already put them.
            - name: sqlite-data
              mountPath: /workspace/local
              subPath: local
          {{- else if $storage.sharedClaim }}
          # Every pod writes uploads here, so the claim has to be ReadWriteMany; the app refuses a local disk the
          # other pods cannot read unless AKAN_STORAGE_SHARED says it is shared.
          volumeMounts:
            - name: shared-uploads
              mountPath: /workspace/local
          {{- end }}
      imagePullSecrets:
        - name: regcred
      {{- if not $cluster }}
      volumes:
        - name: sqlite-data
          persistentVolumeClaim:
            claimName: sqlite-data
      {{- else if $storage.sharedClaim }}
      volumes:
        - name: shared-uploads
          persistentVolumeClaim:
            claimName: {{ $storage.sharedClaim }}
      {{- end }}
{{- if not $cluster }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sqlite-data
  namespace: {{ .Values.appName }}-{{ $branch }}
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ $config.app.resources.storage }}
{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: app-svc
  namespace: {{ .Values.appName }}-{{ $branch }}
spec:
  selector:
    app: app
  ports:
    - protocol: TCP
      port: 8282
      targetPort: 8282
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: app-ingress
  namespace: {{ .Values.appName }}-{{ $branch }}
  annotations:
    ingress.kubernetes.io/ssl-redirect: "true"
    kubernetes.io/tls-acme: "true"
    cert-manager.io/cluster-issuer: letsencrypt-prod
    {{- if dig "cors" "enabled" false $ingress }}
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-headers: "DNT,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization,apollo-require-preflight"
    {{- end }}
    nginx.ingress.kubernetes.io/proxy-body-size: {{ dig "proxyBodySize" "128m" $ingress | quote }}
    nginx.ingress.kubernetes.io/affinity: "cookie"
    nginx.ingress.kubernetes.io/session-cookie-name: "route"
    nginx.ingress.kubernetes.io/session-cookie-expires: "172800"
    nginx.ingress.kubernetes.io/session-cookie-max-age: "172800"
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/allow-snippet-annotations: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /$2$3
    nginx.ingress.kubernetes.io/proxy-buffer-size: "16k"
    nginx.ingress.kubernetes.io/proxy-buffers-number: "4"
    nginx.ingress.kubernetes.io/proxy-busy-buffers-size: "24k"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - {{ .Values.appName }}-{{ $branch }}.{{ .Values.serveDomain }}
{{- range $i, $subRoute := .Values.subRoutes }}
        - {{ $subRoute }}-{{ $branch }}.{{ .Values.serveDomain }}
{{ end}}
{{- range $i, $domain := $config.domains }}
        - {{ $domain }}
{{ end}}
      secretName: cert-{{ .Values.appName }}-{{ $branch }}
  rules:
    - host: {{ .Values.appName }}-{{ $branch }}.{{ .Values.serveDomain }}
      http:
        paths:
          - path: /()(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: app-svc
                port:
                  number: 8282
{{- range $i, $subRoute := .Values.subRoutes }}
    - host: {{ $subRoute }}-{{ $branch }}.{{ .Values.serveDomain }}
      http:
        paths:
          - path: /()(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: app-svc
                port:
                  number: 8282     
{{ end }}
{{- range $i, $domain := $config.domains }}
    - host: {{ $domain }}
      http:
        paths:
          - path: /()(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: app-svc
                port:
                  number: 8282    
{{ end }}
